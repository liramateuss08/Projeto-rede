<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área Administrativa | A REDE</title>

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <main class="admin-container">

        <div class="admin-card">

            <div class="admin-logo">
                A REDE
            </div>

            <span class="admin-subtitulo">
                ÁREA RESTRITA
            </span>

            <h1>
                Acesso administrativo
            </h1>

            <p class="admin-descricao">
                Entre com suas credenciais para acessar
                o painel administrativo.
            </p>

            <form id="adminLoginForm">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn-entrar"
                >
                    Entrar
                </button>

            </form>

            <p
                id="mensagemLogin"
                class="mensagem-login"
            ></p>

            <a
                href="index.html"
                class="voltar"
            >
                ← Voltar para o início
            </a>

        </div>

    </main>

    <script src="js/admin.js"></script>

</body>

</html>
